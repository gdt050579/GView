# .github/workflows/workflow-lint.yml
#
# Static analysis of the CI itself:
#   * zizmor      - security audit of GitHub Actions (template injection, unpinned actions, credential
#                   persistence, excessive permissions, cache poisoning, ...). Findings land in the Security tab.
#   * actionlint  - syntax, expression typing, runner labels, action inputs and shellcheck of `run:` scripts.
name: workflow lint

permissions: {}

on:
  push:
    branches: [ main ]
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write   # upload zizmor SARIF to code scanning
      contents: read           # read the workflow files
      actions: read            # resolve workflow metadata for code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: regular
          min-severity: low

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (checksum-verified release binary)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      # The `$/` self-repository `uses:` syntax (GitHub, July 2026) is not parsed by actionlint 1.7.12 yet
      # (rhysd/actionlint#711, PR #732): that one error is ignored until a release understands it. Drop the
      # `-ignore` once actionlint accepts `uses: $/...` so that the inputs of .github/actions/build are checked again.
      - name: Run actionlint
        run: actionlint -color -ignore 'specifying action "\$/[^"]*" in invalid format because ref is missing'
