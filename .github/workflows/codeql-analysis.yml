# .github/workflows/codeql-analysis.yml
name: CodeQL

permissions: {}

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Weekly re-scan of main so newly published CodeQL queries are applied without a code change.
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      security-events: write   # upload CodeQL results
      packages: read           # fetch CodeQL query packs
      actions: read            # read workflow run metadata
      contents: read           # checkout
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build C++
        if: matrix.language == 'c-cpp'
        uses: $/.github/actions/build
        with:
          build_type: RelWithDebInfo
          enable_tests: "false"
          use_vcpkg_cache: "true"
          # CodeQL must observe every compilation; a ccache hit would hide it from the tracer.
          use_ccache: "false"
          upload_artifact: "false"
          jobs_count: "0"

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
