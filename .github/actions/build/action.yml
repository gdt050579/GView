name: "Reusable Build (composite)"
description: "Configure, build, (optionally) test and upload artifacts with CMake"
inputs:
  build_type:
    description: "CMake build type"
    default: "Release"
  enable_tests:
    description: "Run tests? ('true'|'false')"
    default: "false"
  enable_remote:
    description: "Build the remote TUI (GVIEW_ENABLE_REMOTE)? ('true'|'false')"
    default: "false"
  use_vcpkg_cache:
    description: "Cache vcpkg artifacts? ('true'|'false')"
    default: "true"
  upload_artifact:
    description: "Upload build artifact? ('true'|'false')"
    default: "false"
  artifact_path:
    description: "Path (glob) to upload when upload_artifact=true"
    default: "bin/Release/**"
  jobs_count:
    description: "Number of parallel jobs for build (string number, '0' = auto)"
    default: "0"
  sign_binaries:
    description: "Sign the binaries using a keyless method"
    default: "false"
runs:
  using: "composite"
  steps:
    # --------------------------
    # NOTE: Do NOT checkout here.
    # Let the caller run actions/checkout so this can be used after CodeQL init.
    # --------------------------

    # --------------------------
    # Compute JOBS count
    # --------------------------
    - name: Set JOBS (Linux/macOS)
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: |
        if [ "${{ inputs.jobs_count }}" = "0" ]; then
          echo "JOBS=$(nproc 2>/dev/null || sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
        else
          echo "JOBS=${{ inputs.jobs_count }}" >> "$GITHUB_ENV"
        fi

    - name: Set JOBS (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        if ("${{ inputs.jobs_count }}" -eq "0") {
          "JOBS=$env:NUMBER_OF_PROCESSORS" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ASCII
        } else {
          "JOBS=${{ inputs.jobs_count }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ASCII
        }

    # --------------------------
    # Cache vcpkg (binary cache)
    # --------------------------
    # vcpkg stores one zip per built package in VCPKG_DEFAULT_BINARY_CACHE. Restoring them is a matter of seconds and,
    # unlike caching build/vcpkg_installed, a change of one dependency (vcpkg.json, ports, compiler) only rebuilds the
    # affected packages: the previous cache is restored through restore-keys and the new packages are added to it.
    - name: Setup vcpkg binary cache
      if: ${{ inputs.use_vcpkg_cache == 'true' }}
      shell: bash
      run: |
        VCPKG_CACHE_DIR="${{ github.workspace }}/.vcpkg-binary-cache"
        mkdir -p "$VCPKG_CACHE_DIR"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$VCPKG_CACHE_DIR" >> "$GITHUB_ENV"

    - name: Cache vcpkg packages
      if: ${{ inputs.use_vcpkg_cache == 'true' }}
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.vcpkg-binary-cache
        key: vcpkg-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'AppCUI/vcpkg/versions/baseline.json', 'AppCUI/vcpkg-ports/**') }}
        restore-keys: |
          vcpkg-bin-${{ runner.os }}-${{ runner.arch }}-

    # --------------------------
    # OS dependencies
    # --------------------------
    - name: Install dependencies (Linux)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          gcc-multilib \
          g++-multilib \
          build-essential \
          ninja-build \
          libsdl2-dev \
          libsdl2-ttf-dev \
          libltdl-dev

    - name: Install dependencies (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      env:
        # Homebrew does not provide bottles for Intel macOS anymore: `brew update` + upgrades (cmake, python, openssl,
        # glib, ...) are compiled from source and take ~40 minutes. Use the tools already present on the runner image
        # and only install what is missing, without updating or upgrading anything.
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_UPGRADE: "1"
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ANALYTICS: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
      run: |
        missing=""
        # formula:command pairs (the command tells if the tool is already available)
        for entry in cmake:cmake ninja:ninja pkgconf:pkg-config autoconf:autoconf automake:automake libtool:glibtoolize make:gmake; do
          formula="${entry%%:*}"; tool="${entry##*:}"
          command -v "$tool" >/dev/null 2>&1 || missing="$missing $formula"
        done
        # autoconf-archive only provides m4 macros (no command)
        brew list --versions autoconf-archive >/dev/null 2>&1 || missing="$missing autoconf-archive"
        if [ -n "$missing" ]; then
          echo "Installing:$missing"
          brew install $missing
        else
          echo "All build tools are already installed"
        fi
        cmake --version | head -1
        ninja --version
        echo "VCPKG_CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

    # --------------------------
    # Configure
    # --------------------------
    - name: Configure CMake (Linux/macOS)
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
          -DENABLE_TESTS=${{ inputs.enable_tests == 'true' && 'ON' || 'OFF' }}           -DGVIEW_ENABLE_REMOTE=${{ inputs.enable_remote == 'true' && 'ON' || 'OFF' }}

    - name: Configure CMake (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $enableTests = if ("${{ inputs.enable_tests }}" -eq "true") { "ON" } else { "OFF" }
        $enableRemote = if ("${{ inputs.enable_remote }}" -eq "true") { "ON" } else { "OFF" }
        cmake -S . -B build `
          -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" `
          -DENABLE_TESTS="$enableTests" `
          -DGVIEW_ENABLE_REMOTE="$enableRemote"

    # --------------------------
    # Build
    # --------------------------
    - name: Build (Linux/macOS)
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: |
        cmake --build build \
          --config ${{ inputs.build_type }} \
          --parallel $JOBS

    - name: Build (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        cmake --build build `
          --config "${{ inputs.build_type }}" `
          --parallel $env:JOBS

    # --------------------------
    # Sign binaries
    # --------------------------
    - name: Sign binaries
      if: ${{ inputs.sign_binaries == 'true' }}
      uses: sigstore/cosign-installer@v4.0.0

    - name: Sign binaries (Linux/macOS)
      if: ${{ inputs.sign_binaries == 'true' && runner.os != 'Windows' }}
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: "true"
        COSIGN_OIDC_PROVIDER: "github-actions"
      run: |
        set -euo pipefail

        BIN_DIR="bin/${{ inputs.build_type }}"
        echo "Searching for binaries in: $BIN_DIR"

        # Collect file list (bash 3 compatible for macOS)
        FILES=()
        while IFS= read -r f; do
          FILES+=("$f")
        done < <(find "$BIN_DIR" -type f \( \
            -name "*.so" -o \
            -name "*.a" -o \
            -name "*.dylib" -o \
            -name "*.tpl" -o \
            -name "*.gpl" \
          \))

        if [ "${#FILES[@]}" -eq 0 ]; then
          echo "No binaries found to sign."
          exit 0
        fi

        echo "Signing ${#FILES[@]} binaries..."

        # cosign sign-blob does not support --files across versions; sign one by one.
        for f in "${FILES[@]}"; do
          cosign sign-blob \
            --yes \
            --output-signature "$f.sig" \
            --output-certificate "$f.cert" \
            --bundle "$f.bundle" \
            "$f"
        done

        echo "Signing completed successfully."


    - name: Sign binaries (Windows)
      if: ${{ inputs.sign_binaries == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      env:
        COSIGN_EXPERIMENTAL: "true"
        COSIGN_OIDC_PROVIDER: "github-actions"
      run: |
        $ErrorActionPreference = "Stop"

        $binDir = "bin\${{ inputs.build_type }}"
        Write-Host "Searching for binaries in $binDir"

        $patterns = @("*.dll", "*.exe", "*.tpl", "*.gpl")
        $files = @()

        foreach ($pattern in $patterns) {
          $files += Get-ChildItem -Path $binDir -Recurse -Filter $pattern -File
        }

        if ($files.Count -eq 0) {
          Write-Host "No binaries found to sign."
          exit 0
        }

        Write-Host "Signing $($files.Count) binaries..."

        foreach ($f in $files) {
          cosign sign-blob `
            --yes `
            --output-signature "$($f.FullName).sig" `
            --output-certificate "$($f.FullName).cert" `
            --bundle "$($f.FullName).bundle" `
            $f.FullName

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Cosign failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
        }

        Write-Host "Signing completed successfully."



    # --------------------------
    # Tests
    # --------------------------
    - name: Run tests (Linux/macOS)
      if: ${{ inputs.enable_tests == 'true' && runner.os != 'Windows' }}
      shell: bash
      run: |
        ctest --test-dir build --output-on-failure

    - name: Run tests (Windows)
      if: ${{ inputs.enable_tests == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        ctest --test-dir build --output-on-failure

    # --------------------------
    # Artifact packaging
    # --------------------------
    - name: Package artifact (Linux/macOS)
      if: ${{ inputs.upload_artifact == 'true' && runner.os != 'Windows' }}
      shell: bash
      run: |
        zip_name="build-${{ runner.os }}-${{ inputs.build_type }}.zip"
        zip -9 -r "$zip_name" ${{ inputs.artifact_path }}
        echo "AZIP=$PWD/$zip_name" >> "$GITHUB_ENV"

    - name: Package artifact (Windows)
      if: ${{ inputs.upload_artifact == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $zipName = "build-${{ runner.os }}-${{ inputs.build_type }}.zip"
        $artifactRoot = Join-Path $Env:GITHUB_WORKSPACE "bin\${{ inputs.build_type }}"
        if (!(Test-Path $artifactRoot)) { Write-Host "No files matched: $artifactRoot"; exit 1 }
        $files = Get-ChildItem -Path $artifactRoot -Recurse -File
        if (!$files) { Write-Host "No files matched: $artifactRoot"; exit 1 }
        $dest = Join-Path $Env:GITHUB_WORKSPACE $zipName
        if (Test-Path $dest) { Remove-Item $dest }
        Push-Location $Env:GITHUB_WORKSPACE
        Compress-Archive -Path ("bin\${{ inputs.build_type }}\*") -DestinationPath $dest -Force
        Pop-Location
        "AZIP=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ASCII

    # --------------------------
    # Upload
    # --------------------------
    - name: Upload artifact
      if: ${{ inputs.upload_artifact == 'true' && env.AZIP != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ runner.os }}-${{ inputs.build_type }}
        path: ${{ env.AZIP }}
        retention-days: 1
