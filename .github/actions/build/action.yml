name: "Reusable Build (composite)"
description: "Configure, build, (optionally) test, sign and upload artifacts with CMake"
inputs:
  build_type:
    description: "CMake build type"
    default: "Release"
  enable_tests:
    description: "Run tests? ('true'|'false')"
    default: "false"
  enable_remote:
    description: "Build the remote TUI (GVIEW_ENABLE_REMOTE)? ('true'|'false')"
    default: "false"
  use_vcpkg_cache:
    description: "Cache vcpkg artifacts? ('true'|'false'). Keep 'false' for release builds so shipped dependencies are always built from source."
    default: "true"
  use_ccache:
    description: "Use ccache for the GView sources on Linux? ('true'|'false'). Ignored on Windows and macOS."
    default: "true"
  upload_artifact:
    description: "Upload build artifact? ('true'|'false')"
    default: "false"
  jobs_count:
    description: "Number of parallel jobs for build (string number, '0' = auto)"
    default: "0"
  sign_binaries:
    description: "Sign the binaries using Sigstore keyless signing (requires 'id-token: write')"
    default: "false"
outputs:
  version:
    description: "GVIEW_VERSION read from GViewCore/include/GView.hpp"
    value: ${{ steps.meta.outputs.version }}
  archive:
    description: "Absolute path of the packaged archive (when upload_artifact is 'true')"
    value: ${{ steps.pkg_unix.outputs.zip_path || steps.pkg_win.outputs.zip_path }}
runs:
  using: "composite"
  steps:
    # --------------------------
    # NOTE: Do NOT checkout here.
    # Let the caller run actions/checkout so this can be used after CodeQL init.
    # --------------------------

    # --------------------------
    # Compute the JOBS count and the GView version (bash is available on every runner, including Windows)
    # --------------------------
    - name: Read build metadata
      id: meta
      shell: bash
      env:
        JOBS_INPUT: ${{ inputs.jobs_count }}
      run: |
        set -euo pipefail
        if [ "$JOBS_INPUT" = "0" ]; then
          jobs=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-2}")
        else
          jobs="$JOBS_INPUT"
        fi
        ver=$(sed -n 's/^#define GVIEW_VERSION "\([0-9][0-9.]*\)".*/\1/p' GViewCore/include/GView.hpp | head -n 1)
        if [ -z "$ver" ]; then
          echo "::error::Could not read GVIEW_VERSION from GViewCore/include/GView.hpp"
          exit 1
        fi
        echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
        echo "version=$ver" >> "$GITHUB_OUTPUT"
        echo "GView version: $ver, parallel jobs: $jobs"

    # --------------------------
    # Cache vcpkg (binary cache)
    # --------------------------
    # vcpkg stores one zip per built package in the binary cache. Restoring them is a matter of seconds and,
    # unlike caching build/vcpkg_installed, a change of one dependency (vcpkg.json, ports, compiler) only rebuilds the
    # affected packages: the previous cache is restored through restore-keys and the new packages are added to it.
    # The cache location is handed to vcpkg through VCPKG_BINARY_SOURCES on the configure step (see below).
    - name: Create vcpkg binary cache directory
      if: ${{ inputs.use_vcpkg_cache == 'true' }}
      shell: bash
      run: mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binary-cache"

    - name: Cache vcpkg packages
      if: ${{ inputs.use_vcpkg_cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.vcpkg-binary-cache
        key: vcpkg-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'AppCUI/vcpkg/versions/baseline.json', 'AppCUI/vcpkg-ports/**') }}
        restore-keys: |
          vcpkg-bin-${{ runner.os }}-${{ runner.arch }}-

    # --------------------------
    # OS dependencies
    # --------------------------
    - name: Install dependencies (Linux)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      env:
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        sudo apt-get update -y
        pkgs=(build-essential ninja-build libsdl2-dev libsdl2-ttf-dev libltdl-dev)
        # The multilib packages only exist on x86 (they add the 32-bit cross toolchain). Nothing in GView needs
        # them, but they stay on X64 so that lane is unchanged.
        if [ "$RUNNER_ARCH_NAME" = "X64" ]; then
          pkgs+=(gcc-multilib g++-multilib)
        fi
        sudo apt-get install -y "${pkgs[@]}"

    - name: Install dependencies (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      env:
        # Homebrew does not provide bottles for Intel macOS anymore: `brew update` + upgrades (cmake, python, openssl,
        # glib, ...) are compiled from source and take ~40 minutes. Use the tools already present on the runner image
        # and only install what is missing, without updating or upgrading anything.
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_UPGRADE: "1"
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ANALYTICS: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
      run: |
        missing=""
        # formula:command pairs (the command tells if the tool is already available)
        for entry in cmake:cmake ninja:ninja pkgconf:pkg-config autoconf:autoconf automake:automake libtool:glibtoolize make:gmake; do
          formula="${entry%%:*}"; tool="${entry##*:}"
          command -v "$tool" >/dev/null 2>&1 || missing="$missing $formula"
        done
        # autoconf-archive only provides m4 macros (no command)
        brew list --versions autoconf-archive >/dev/null 2>&1 || missing="$missing autoconf-archive"
        if [ -n "$missing" ]; then
          echo "Installing:$missing"
          brew install $missing
        else
          echo "All build tools are already installed"
        fi
        cmake --version | head -1
        ninja --version

    # --------------------------
    # Compiler cache for the GView sources (Linux only: apt install is instant, and the Makefile generator supports
    # compiler launchers). vcpkg dependencies are covered by the vcpkg binary cache above.
    # --------------------------
    - name: Setup ccache (Linux)
      if: ${{ inputs.use_ccache == 'true' && runner.os == 'Linux' }}
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build_type }}-tests${{ inputs.enable_tests }}
        max-size: 500M

    # --------------------------
    # Configure
    #   VCPKG_BINARY_SOURCES : 'clear' disables every binary cache (release builds compile all dependencies from
    #                          source); otherwise the directory restored by actions/cache above is used read/write.
    #   VCPKG_CMAKE_GENERATOR: Ninja for the vcpkg ports on macOS (installed above).
    #   CMAKE_*_LAUNCHER     : CMake >= 3.17 seeds the compiler launcher from these environment variables.
    # --------------------------
    - name: Configure CMake (Linux/macOS)
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build_type }}
        ENABLE_TESTS: ${{ inputs.enable_tests == 'true' && 'ON' || 'OFF' }}
        ENABLE_REMOTE: ${{ inputs.enable_remote == 'true' && 'ON' || 'OFF' }}
        VCPKG_BINARY_SOURCES: ${{ inputs.use_vcpkg_cache == 'true' && format('clear;files,{0}/.vcpkg-binary-cache,readwrite', github.workspace) || 'clear' }}
        VCPKG_CMAKE_GENERATOR: ${{ runner.os == 'macOS' && 'Ninja' || '' }}
        CMAKE_C_COMPILER_LAUNCHER: ${{ inputs.use_ccache == 'true' && runner.os == 'Linux' && 'ccache' || '' }}
        CMAKE_CXX_COMPILER_LAUNCHER: ${{ inputs.use_ccache == 'true' && runner.os == 'Linux' && 'ccache' || '' }}
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
          -DENABLE_TESTS="$ENABLE_TESTS" \
          -DGVIEW_ENABLE_REMOTE="$ENABLE_REMOTE"

    - name: Configure CMake (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      env:
        BUILD_TYPE: ${{ inputs.build_type }}
        ENABLE_TESTS: ${{ inputs.enable_tests == 'true' && 'ON' || 'OFF' }}
        ENABLE_REMOTE: ${{ inputs.enable_remote == 'true' && 'ON' || 'OFF' }}
        VCPKG_BINARY_SOURCES: ${{ inputs.use_vcpkg_cache == 'true' && format('clear;files,{0}/.vcpkg-binary-cache,readwrite', github.workspace) || 'clear' }}
      run: |
        cmake -S . -B build `
          -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
          -DENABLE_TESTS="$env:ENABLE_TESTS" `
          -DGVIEW_ENABLE_REMOTE="$env:ENABLE_REMOTE"

    # --------------------------
    # Build
    # --------------------------
    - name: Build
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build_type }}
        JOBS: ${{ steps.meta.outputs.jobs }}
      run: |
        cmake --build build --config "$BUILD_TYPE" --parallel "$JOBS"

    # --------------------------
    # Tests
    # --------------------------
    - name: Run tests
      if: ${{ inputs.enable_tests == 'true' }}
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build_type }}
      run: |
        ctest --test-dir build -C "$BUILD_TYPE" --output-on-failure --timeout 600 --output-junit "$GITHUB_WORKSPACE/test-results.xml"

    - name: Upload test results
      if: ${{ inputs.enable_tests == 'true' && always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build_type }}
        path: |
          test-results.xml
          build/Testing/Temporary/LastTest.log
        if-no-files-found: ignore
        retention-days: 7

    # --------------------------
    # Sign binaries (Sigstore keyless: the signing identity is this workflow, no long-lived key exists)
    # --------------------------
    - name: Install cosign
      if: ${{ inputs.sign_binaries == 'true' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign binaries
      if: ${{ inputs.sign_binaries == 'true' }}
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build_type }}
      run: |
        set -euo pipefail
        BIN_DIR="bin/$BUILD_TYPE"
        echo "Searching for binaries in: $BIN_DIR"

        # Collect file list (bash 3 compatible for macOS). Executables, shared libraries and GView plugins.
        FILES=()
        while IFS= read -r f; do
          FILES+=("$f")
        done < <(find "$BIN_DIR" -type f \( \
            -name "GView" -o -name "GView.exe" -o \
            -name "GViewUpdater" -o -name "GViewUpdater.exe" -o \
            -name "*.so" -o -name "*.dylib" -o -name "*.dll" -o \
            -name "*.tpl" -o -name "*.gpl" \
          \) | sort)

        if [ "${#FILES[@]}" -eq 0 ]; then
          echo "::error::No binaries found to sign in $BIN_DIR"
          exit 1
        fi

        echo "Signing ${#FILES[@]} binaries..."
        for f in "${FILES[@]}"; do
          cosign sign-blob --yes \
            --output-signature "$f.sig" \
            --output-certificate "$f.cert" \
            --bundle "$f.bundle" \
            "$f"
        done
        echo "Signing completed successfully."

    # --------------------------
    # Artifact packaging: the archive root is the content of bin/<build_type> on every platform,
    # named GView-<version>-<OS>-<ARCH>.zip (e.g. GView-0.394.0-Linux-X64.zip).
    # --------------------------
    - name: Package artifact (Linux/macOS)
      id: pkg_unix
      if: ${{ inputs.upload_artifact == 'true' && runner.os != 'Windows' }}
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build_type }}
        GVIEW_VERSION: ${{ steps.meta.outputs.version }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        zip_name="GView-${GVIEW_VERSION}-${RUNNER_OS_NAME}-${RUNNER_ARCH_NAME}.zip"
        test -d "bin/$BUILD_TYPE" || { echo "::error::bin/$BUILD_TYPE does not exist"; exit 1; }
        ( cd "bin/$BUILD_TYPE" && zip -9 -r -y "$GITHUB_WORKSPACE/$zip_name" . )
        echo "zip_path=$GITHUB_WORKSPACE/$zip_name" >> "$GITHUB_OUTPUT"
        echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

    - name: Package artifact (Windows)
      id: pkg_win
      if: ${{ inputs.upload_artifact == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      env:
        BUILD_TYPE: ${{ inputs.build_type }}
        GVIEW_VERSION: ${{ steps.meta.outputs.version }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        $ErrorActionPreference = "Stop"
        $zipName = "GView-$env:GVIEW_VERSION-$env:RUNNER_OS_NAME-$env:RUNNER_ARCH_NAME.zip"
        $artifactRoot = Join-Path $Env:GITHUB_WORKSPACE "bin\$env:BUILD_TYPE"
        if (!(Test-Path $artifactRoot)) { Write-Error "No files matched: $artifactRoot"; exit 1 }
        $files = Get-ChildItem -Path $artifactRoot -Recurse -File
        if (!$files) { Write-Error "No files matched: $artifactRoot"; exit 1 }
        $dest = Join-Path $Env:GITHUB_WORKSPACE $zipName
        if (Test-Path $dest) { Remove-Item $dest }
        Compress-Archive -Path (Join-Path $artifactRoot "*") -DestinationPath $dest -CompressionLevel Optimal -Force
        "zip_path=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ASCII
        "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ASCII

    - name: Compute archive checksum
      if: ${{ inputs.upload_artifact == 'true' }}
      shell: bash
      env:
        ZIP_PATH: ${{ steps.pkg_unix.outputs.zip_path || steps.pkg_win.outputs.zip_path }}
        ZIP_NAME: ${{ steps.pkg_unix.outputs.zip_name || steps.pkg_win.outputs.zip_name }}
      run: |
        set -euo pipefail
        cd "$(dirname "$ZIP_PATH")"
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
        else
          shasum -a 256 "$ZIP_NAME" > "$ZIP_NAME.sha256"
        fi
        cat "$ZIP_NAME.sha256"

    # --------------------------
    # Upload
    # --------------------------
    - name: Upload artifact
      if: ${{ inputs.upload_artifact == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.build_type }}
        path: |
          ${{ steps.pkg_unix.outputs.zip_path || steps.pkg_win.outputs.zip_path }}
          ${{ steps.pkg_unix.outputs.zip_path || steps.pkg_win.outputs.zip_path }}.sha256
        if-no-files-found: error
        retention-days: 1
