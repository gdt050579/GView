[workspace]
resolver = "2"

members = [
    "crates/gview-core",
    "crates/gview-view",
    "crates/gview-app",
    "crates/gview-disasm",
    "crates/gview-hashes",
    "crates/gview-entropy",
    "crates/gview-decoding",
    "crates/gview-security",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/gdt050579/GView"

[profile.release]
lto = "thin"
codegen-units = 1
