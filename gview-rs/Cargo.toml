[workspace]
resolver = "2"

members = [
    "crates/gview-core",
    "crates/gview-view",
    "crates/gview-app",
    "crates/gview-disasm",
    "crates/gview-hashes",
    "crates/gview-entropy",
    "crates/gview-decoding",
    "crates/gview-security",
    "crates/gview-assistant",
    "crates/gview-plugin",
    "crates/gview-plugin-ffi",
    "plugins/type/gview-types-pe",
    "plugins/type/gview-types-elf",
    "plugins/type/gview-types-macho",
    "plugins/type/gview-types-zip",
    "plugins/type/gview-types-pcap",
    "plugins/generic/gview-generic-hashes",
    "plugins/generic/gview-generic-entropy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/gdt050579/GView"

[profile.release]
lto = "thin"
codegen-units = 1
