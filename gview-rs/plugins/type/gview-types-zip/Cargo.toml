[package]
name = "gview-types-zip"
description = "GView type plugin: ZIP archives (container viewer over the central directory)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gview-core = { path = "../../../crates/gview-core" }
gview-decoding = { path = "../../../crates/gview-decoding" }
gview-plugin = { path = "../../../crates/gview-plugin" }
gview-view = { path = "../../../crates/gview-view" }
serde_json = "1"

[dev-dependencies]
zip = { version = "8", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
